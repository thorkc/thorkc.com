name: Asset Pipeline

on:
  push:
      branches: [main]
          paths:
                - 'assets/images/source/**'
                      - 'scripts/optimize-assets.js'
                            - 'scripts/upload-to-r2.js'
                                  - '.github/workflows/asset-pipeline.yml'
                                    workflow_dispatch:

                                    jobs:
                                      optimize-and-upload:
                                          runs-on: ubuntu-latest

                                              steps:
                                                    - name: Checkout repo
                                                            uses: actions/checkout@v4
                                                                    with:
                                                                              fetch-depth: 0

                                                                                    - name: Set up Node.js
                                                                                            uses: actions/setup-node@v4
                                                                                                    with:
                                                                                                              node-version: '20'
                                                                                                                        cache: 'npm'
                                                                                                                        
                                                                                                                              - name: Install dependencies
                                                                                                                                      run: npm ci
                                                                                                                                      
                                                                                                                                            - name: Optimize assets (WebP + AVIF, resize, strip metadata)
                                                                                                                                                    run: node scripts/optimize-assets.js
                                                                                                                                                    
                                                                                                                                                          - name: Upload changed assets to R2
                                                                                                                                                                  env:
                                                                                                                                                                            R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                                                                                                                                                                                      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                                                                                                                                                                                                R2_BUCKET: ${{ secrets.R2_BUCKET }}
                                                                                                                                                                                                          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
                                                                                                                                                                                                                    ASSET_BACKEND: ${{ secrets.ASSET_BACKEND }}
                                                                                                                                                                                                                            run: node scripts/upload-to-r2.js
                                                                                                                                                                                                                            
                                                                                                                                                                                                                                  - name: Commit optimized assets back to repo
                                                                                                                                                                                                                                          uses: stefanzweifel/git-auto-commit-action@v5
                                                                                                                                                                                                                                                  with:
                                                                                                                                                                                                                                                            commit_message: "chore: auto-optimize assets [skip ci]"
                                                                                                                                                                                                                                                                      file_pattern: "assets/**"
                                                                                                                                                                                                                                                                                commit_user_name: "ThorKC Asset Bot"
                                                                                                                                                                                                                                                                                          commit_user_email: "assets@thorkc.com"
                                                                                                                                                                                                                                                                                          
